
name: Build MP Sound Package Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install requirements
        run: python -m pip install -r requirements.txt
      
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build the application
        shell: bash
        env:
          DATA_SEPARATOR: ${{ runner.os == 'Windows' && ';' || ':' }}
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name "MP Sound Package Builder" \
            --icon=assets/app.ico \
            --add-data "assets/audio.ini${DATA_SEPARATOR}assets" \
            MP_SoundPackageBuilder.py

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: MP_SoundPackageBuilder_${{ matrix.os }}
          path: dist/
          if-no-files-found: error